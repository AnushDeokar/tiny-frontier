name: exp1_LLLLLG_w32
model:
  vocab_size: 4096
  d_model: 192
  n_heads: 6
  d_ff: 512
  n_layers: 6
  max_seq_len: 256
  n_kv_heads: null
  head_dim: null
  tie_embeddings: true
  norm_eps: 1.0e-06
  norm_offset: false
  embed_scale: false
  qk_norm: false
  post_norm: false
  mlp_activation: silu
  layer_pattern: LLLLLG
  window: 32
  rope_base: 10000.0
  rope_base_local: null
train:
  seed: 1337
  batch_size: 32
  total_tokens: 50000000
  lr: 0.005
  min_lr_ratio: 0.1
  warmup_steps: 200
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_every: 250
  eval_batches: 60
  log_every: 50
  device: auto
  train_path: data/train.bin
  val_path: data/val.bin
  tokenizer_path: data/tokenizer.json
  sample_prompt: Once upon a time
