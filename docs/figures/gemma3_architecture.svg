<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 115 1000 1185" width="1000" height="1185" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <g id="rope">
      <circle r="8" fill="none" stroke="#3b82c4" stroke-width="1.8"/>
      <path d="M-5,1 q2.5,-6 5,0 t5,0" fill="none" stroke="#3b82c4" stroke-width="1.8"/>
    </g>
  </defs>

  <rect y="115" width="1000" height="1185" fill="#ffffff"/>

  <!-- ===== Repeated block ===== -->
  <rect x="120" y="375" width="400" height="675" rx="4" fill="#f8f8f8" stroke="#7a5c5c" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="535" y="660" font-size="34" fill="#222">18×</text>

  <!-- Input and embeddings -->
  <text x="330" y="1222" font-size="15" text-anchor="middle" fill="#222">Input tokens</text>
  <line x1="330" y1="1205" x2="330" y2="1182" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="190" y="1140" width="280" height="40" rx="3" fill="#f6dfe1" stroke="#333" stroke-width="1.5"/>
  <text x="330" y="1165" font-size="15" text-anchor="middle">Embeddings (262k vocab)</text>
  <line x1="330" y1="1140" x2="330" y2="1117" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="190" y="1075" width="280" height="40" rx="3" fill="#f6dfe1" stroke="#d9480f" stroke-width="2.5" stroke-dasharray="7,4"/>
  <text x="330" y="1100" font-size="15" text-anchor="middle">× √d_model  (√640 ≈ 25.3)</text>
  <line x1="330" y1="1075" x2="330" y2="1013" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Input RMSNorm -->
  <rect x="190" y="975" width="280" height="36" rx="3" fill="#eef3cf" stroke="#333" stroke-width="1.5"/>
  <text x="330" y="998" font-size="15" text-anchor="middle">RMS Norm</text>

  <!-- Q K V fan-out -->
  <line x1="330" y1="975" x2="330" y2="960" stroke="#222" stroke-width="2"/>
  <line x1="240" y1="960" x2="420" y2="960" stroke="#222" stroke-width="2"/>
  <line x1="240" y1="960" x2="240" y2="937" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="960" x2="330" y2="937" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="960" x2="420" y2="852" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- QK-norm -->
  <rect x="205" y="900" width="70" height="35" rx="3" fill="#eef3cf" stroke="#d9480f" stroke-width="2.5" stroke-dasharray="7,4"/>
  <text x="240" y="922" font-size="13" text-anchor="middle">Q-Norm</text>
  <rect x="295" y="900" width="70" height="35" rx="3" fill="#eef3cf" stroke="#d9480f" stroke-width="2.5" stroke-dasharray="7,4"/>
  <text x="330" y="922" font-size="13" text-anchor="middle">K-Norm</text>
  <line x1="240" y1="900" x2="240" y2="852" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="900" x2="330" y2="852" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Q K V labels + RoPE -->
  <text x="222" y="882" font-size="17" font-weight="bold">Q</text>
  <use href="#rope" x="260" y="876"/>
  <text x="312" y="882" font-size="17" font-weight="bold">K</text>
  <use href="#rope" x="350" y="876"/>
  <text x="428" y="882" font-size="17" font-weight="bold">V</text>

  <!-- Attention -->
  <rect x="190" y="780" width="280" height="70" rx="3" fill="#fde3bf" stroke="#d9480f" stroke-width="2.5" stroke-dasharray="7,4"/>
  <text x="330" y="803" font-size="15" text-anchor="middle">Self-Attention (Multi-Query)</text>
  <text x="330" y="822" font-size="13" text-anchor="middle">4 Q heads · 1 KV head · with KV Cache</text>
  <text x="330" y="840" font-size="13" text-anchor="middle">local: last 512 tokens | global: all</text>
  <line x1="330" y1="780" x2="330" y2="757" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Post-attention norm -->
  <rect x="190" y="720" width="280" height="35" rx="3" fill="#eef3cf" stroke="#d9480f" stroke-width="2.5" stroke-dasharray="7,4"/>
  <text x="330" y="743" font-size="15" text-anchor="middle">RMS Norm (post-attention)</text>
  <line x1="330" y1="720" x2="330" y2="707" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Residual add 1 -->
  <circle cx="330" cy="693" r="12" fill="#fff" stroke="#222" stroke-width="2"/>
  <line x1="322" y1="693" x2="338" y2="693" stroke="#222" stroke-width="2"/>
  <line x1="330" y1="685" x2="330" y2="701" stroke="#222" stroke-width="2"/>
  <polyline points="330,1030 160,1030 160,693 316,693" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="681" x2="330" y2="642" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Pre-FF norm -->
  <rect x="190" y="605" width="280" height="35" rx="3" fill="#eef3cf" stroke="#333" stroke-width="1.5"/>
  <text x="330" y="628" font-size="15" text-anchor="middle">RMS Norm</text>
  <line x1="330" y1="605" x2="330" y2="582" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Feed forward -->
  <rect x="190" y="520" width="280" height="60" rx="3" fill="#d6ecf6" stroke="#d9480f" stroke-width="2.5" stroke-dasharray="7,4"/>
  <text x="330" y="546" font-size="15" text-anchor="middle">Feed Forward</text>
  <text x="330" y="566" font-size="15" text-anchor="middle">GeGLU</text>
  <line x1="330" y1="520" x2="330" y2="497" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Post-FF norm -->
  <rect x="190" y="460" width="280" height="35" rx="3" fill="#eef3cf" stroke="#d9480f" stroke-width="2.5" stroke-dasharray="7,4"/>
  <text x="330" y="483" font-size="15" text-anchor="middle">RMS Norm (post-feedforward)</text>
  <line x1="330" y1="460" x2="330" y2="437" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Residual add 2 -->
  <circle cx="330" cy="423" r="12" fill="#fff" stroke="#222" stroke-width="2"/>
  <line x1="322" y1="423" x2="338" y2="423" stroke="#222" stroke-width="2"/>
  <line x1="330" y1="415" x2="330" y2="431" stroke="#222" stroke-width="2"/>
  <polyline points="330,665 160,665 160,423 316,423" fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="411" x2="330" y2="307" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Head ===== -->
  <rect x="190" y="270" width="280" height="35" rx="3" fill="#eef3cf" stroke="#333" stroke-width="1.5"/>
  <text x="330" y="293" font-size="15" text-anchor="middle">RMS Norm</text>
  <line x1="330" y1="270" x2="330" y2="242" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="190" y="200" width="280" height="40" rx="3" fill="#e3e3f1" stroke="#333" stroke-width="1.5"/>
  <text x="330" y="225" font-size="15" text-anchor="middle">Linear (tied to Embeddings)</text>
  <line x1="330" y1="200" x2="330" y2="177" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="190" y="135" width="280" height="40" rx="3" fill="#dcefdc" stroke="#333" stroke-width="1.5"/>
  <text x="330" y="160" font-size="15" text-anchor="middle">Softmax</text>

  <!-- ===== Annotations ===== -->
  <g font-size="13.5" fill="#333">
    <line x1="475" y1="1095" x2="595" y2="1095" stroke="#aaa" stroke-width="1"/>
    <text x="600" y="1091">Embeddings scaled up by √d: the matrix is</text>
    <text x="600" y="1108">shared with the output layer, so it stays small</text>

    <line x1="475" y1="993" x2="595" y2="993" stroke="#aaa" stroke-width="1"/>
    <text x="600" y="989">Every RMS Norm here scales by (1 + w),</text>
    <text x="600" y="1006">w stored near 0 (LLaMA: w, stored near 1)</text>

    <line x1="434" y1="917" x2="595" y2="917" stroke="#aaa" stroke-width="1"/>
    <text x="600" y="913">QK-norm: RMS Norm on each q and k head</text>
    <text x="600" y="930">(256 dims), applied before RoPE</text>

    <line x1="448" y1="876" x2="595" y2="876" stroke="#aaa" stroke-width="1"/>
    <use href="#rope" x="608" y="872"/>
    <text x="622" y="878">RoPE base 10k (local) · 1M (global)</text>

    <line x1="475" y1="815" x2="595" y2="815" stroke="#aaa" stroke-width="1"/>
    <text x="600" y="811">5 of every 6 layers are local (sliding</text>
    <text x="600" y="828">window, 512 tokens); every 6th is global</text>

    <line x1="475" y1="737" x2="595" y2="737" stroke="#aaa" stroke-width="1"/>
    <text x="600" y="742">"Sandwich" norm on the attention output</text>

    <line x1="475" y1="550" x2="595" y2="550" stroke="#aaa" stroke-width="1"/>
    <text x="600" y="546">GeGLU: GELU (tanh) gate instead of</text>
    <text x="600" y="563">LLaMA's SiLU (SwiGLU)</text>

    <line x1="475" y1="477" x2="595" y2="477" stroke="#aaa" stroke-width="1"/>
    <text x="600" y="482">"Sandwich" norm on the feed-forward output</text>
  </g>

  <!-- Layer pattern strip -->
  <g font-size="13.5" fill="#333">
    <text x="600" y="1162" font-weight="bold">Layer pattern (18 layers)</text>
    <g transform="translate(600,1172)">
      <rect x="0" y="0" width="18" height="22" fill="#fde3bf" stroke="#333"/>
      <rect x="21" y="0" width="18" height="22" fill="#fde3bf" stroke="#333"/>
      <rect x="42" y="0" width="18" height="22" fill="#fde3bf" stroke="#333"/>
      <rect x="63" y="0" width="18" height="22" fill="#fde3bf" stroke="#333"/>
      <rect x="84" y="0" width="18" height="22" fill="#fde3bf" stroke="#333"/>
      <rect x="105" y="0" width="18" height="22" fill="#b4541f" stroke="#333"/>
      <rect x="126" y="0" width="18" height="22" fill="#fde3bf" stroke="#333"/>
      <rect x="147" y="0" width="18" height="22" fill="#fde3bf" stroke="#333"/>
      <rect x="168" y="0" width="18" height="22" fill="#fde3bf" stroke="#333"/>
      <rect x="189" y="0" width="18" height="22" fill="#fde3bf" stroke="#333"/>
      <rect x="210" y="0" width="18" height="22" fill="#fde3bf" stroke="#333"/>
      <rect x="231" y="0" width="18" height="22" fill="#b4541f" stroke="#333"/>
      <rect x="252" y="0" width="18" height="22" fill="#fde3bf" stroke="#333"/>
      <rect x="273" y="0" width="18" height="22" fill="#fde3bf" stroke="#333"/>
      <rect x="294" y="0" width="18" height="22" fill="#fde3bf" stroke="#333"/>
      <rect x="315" y="0" width="18" height="22" fill="#fde3bf" stroke="#333"/>
      <rect x="336" y="0" width="18" height="22" fill="#fde3bf" stroke="#333"/>
      <rect x="357" y="0" width="18" height="22" fill="#b4541f" stroke="#333"/>
    </g>
    <rect x="600" y="1206" width="14" height="14" fill="#fde3bf" stroke="#333"/>
    <text x="620" y="1218">local (window 512)</text>
    <rect x="760" y="1206" width="14" height="14" fill="#b4541f" stroke="#333"/>
    <text x="780" y="1218">global (all tokens)</text>

    <rect x="600" y="1236" width="40" height="18" rx="2" fill="#fff" stroke="#d9480f" stroke-width="2.5" stroke-dasharray="7,4"/>
    <text x="648" y="1250">= differs from LLaMA</text>
  </g>

  <!-- Title -->
  <text x="330" y="1278" font-size="30" font-weight="bold" text-anchor="middle">Gemma 3 (270M)</text>
</svg>
